{% extends 'base/base.html' %}

{% block title %}Access Denied - E-Commerce Store{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                    <h3>Access Denied</h3>
                    <p class="text-muted">You don't have permission to access the sales dashboard.</p>
                    <p class="text-muted">This area is restricted to admin users only.</p>
                    <a href="{% url 'home' %}" class="btn btn-primary">
                        <i class="fas fa-home"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
