{% extends 'base/base.html' %}

{% block title %}Product Comparison - E-Commerce Store{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="text-center py-5">
        <i class="fas fa-balance-scale fa-4x text-muted mb-3"></i>
        <h2>No Products to Compare</h2>
        <p class="text-muted">You haven't added any products to compare yet.</p>
        <p class="text-muted">Browse our products and click "Add to Compare" to start comparing!</p>
        <a href="{% url 'home' %}" class="btn btn-primary">
            <i class="fas fa-shopping-cart"></i> Browse Products
        </a>
    </div>
</div>
{% endblock %}
