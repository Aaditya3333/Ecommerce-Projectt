{% extends 'base/base.html' %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">
                    <h5>Admin Menu</h5>
                </div>
                <div class="list-group list-group-flush">
                    <a href="{% url 'admin_dashboard' %}" class="list-group-item list-group-item-action">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a href="{% url 'admin_categories' %}" class="list-group-item list-group-item-action">
                        <i class="fas fa-tags"></i> Categories
                    </a>
                    <a href="{% url 'admin_products' %}" class="list-group-item list-group-item-action">
                        <i class="fas fa-box"></i> Products
                    </a>
                    <a href="{% url 'home' %}" class="list-group-item list-group-item-action">
                        <i class="fas fa-store"></i> Store Front
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            {% block admin_content %}
            {% endblock %}
        </div>
    </div>
</div>
{% endblock %}
