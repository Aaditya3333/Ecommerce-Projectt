{% extends 'base/base.html' %}

{% block title %}Edit Address - Aaditya Store{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0"><i class="fas fa-edit"></i> Edit Address</h5>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Address Type</label>
                                    <select name="address_type" class="form-select" required>
                                        <option value="home" {% if address.address_type == 'home' %}selected{% endif %}>Home</option>
                                        <option value="work" {% if address.address_type == 'work' %}selected{% endif %}>Work</option>
                                        <option value="other" {% if address.address_type == 'other' %}selected{% endif %}>Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Address Name</label>
                                    <input type="text" name="name" class="form-control" value="{{ address.name }}" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Recipient Name</label>
                                    <input type="text" name="recipient_name" class="form-control" value="{{ address.recipient_name }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Phone Number</label>
                                    <input type="tel" name="phone" class="form-control" value="{{ address.phone }}" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Street Address</label>
                                <textarea name="address" class="form-control" rows="3" required>{{ address.address }}</textarea>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">City</label>
                                    <input type="text" name="city" class="form-control" value="{{ address.city }}" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Postal Code</label>
                                    <input type="text" name="postal_code" class="form-control" value="{{ address.postal_code }}" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">State/Province</label>
                                    <input type="text" name="state" class="form-control" value="{{ address.state }}">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Country</label>
                                <input type="text" name="country" class="form-control" value="{{ address.country }}" required>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" name="is_default" class="form-check-input" id="is_default" {% if address.is_default %}checked{% endif %}>
                                <label class="form-check-label" for="is_default">Set as default address</label>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Update Address</button>
                                <a href="{% url 'address_list' %}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
